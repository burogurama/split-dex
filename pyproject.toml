[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "split-dex"
version = "0.1.0"
description = "Split the classes of an Android APK into grouped DEX files"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Mohamed Nasser" }]
keywords = ["android", "dex", "apk", "multidex", "split"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]
# dexpp reads, analyses and writes the DEX files.
dependencies = ["dexpp>=0.2.0,<0.3"]

[project.urls]
Homepage = "https://github.com/burogurama/split-dex"
Issues = "https://github.com/burogurama/split-dex/issues"
Changelog = "https://github.com/burogurama/split-dex/blob/main/CHANGELOG.md"

[project.scripts]
split-dex = "split_dex.cli:main"

[dependency-groups]
dev = ["mypy>=1.15", "pytest>=8.3", "ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["split_dex"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
# No maximum line length: the formatter wraps what it can.
ignore = ["E501"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.mypy]
strict = true
files = ["split_dex", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py"]
