name: Release

# A v* tag builds the wheel and the sdist, checks that the wheel installs and runs, and publishes
# both as a GitHub release, with the matching CHANGELOG.md section as the notes, then on PyPI.
# Pull requests that touch the packaging, and manual runs, build and check everything without
# publishing.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - pyproject.toml
  workflow_dispatch:

jobs:
  build:
    name: wheel and sdist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # setup-uv has no major-version tags (v10) since v8: pin a full version.
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.14"
      - name: Build
        run: uv build
      # Install the wheel as users will, with dexpp from PyPI.
      - name: Install the wheel and run it
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/split-dex --list-strategies
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Check the tag matches the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject.toml ($version)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Extract release notes
        run: |
          # The CHANGELOG.md section for this version, without its heading.
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "split-dex $VERSION" --notes-file notes.md

  pypi:
    name: PyPI
    # After the GitHub release, so the tag check above also guards this upload: PyPI never accepts
    # the same version twice.
    needs: [release]
    runs-on: ubuntu-24.04
    # PyPI trusts uploads from this workflow file running in this environment (trusted
    # publishing), so no API token is stored anywhere. The repository settings allow the
    # environment only for v* tags.
    environment:
      name: pypi
      url: https://pypi.org/project/split-dex/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
