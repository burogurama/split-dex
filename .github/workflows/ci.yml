name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build & test (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Clang needs >= 19: earlier Clang reports __cpp_concepts=201907,
          # which guards out libstdc++'s <expected>.
          - compiler: gcc
            cc: gcc-13
            cxx: g++-13
            clang_version: ""
          - compiler: clang
            cc: clang-19
            cxx: clang++-19
            clang_version: "19"
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang
        if: matrix.clang_version != ''
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.clang_version }}
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.cxx }}
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-24.04
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y g++-13
      - name: Configure
        # Debug keeps assertions on and the stack traces exact.
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DSPLITDEX_SANITIZE=address,undefined
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          ASAN_OPTIONS: detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: Check formatting
        # Pinned to clang-format-18, the version the tree is formatted with; a
        # newer clang-format may reflow differently.
        run: |
          git ls-files '*.cc' '*.cpp' '*.hpp' '*.h' \
            | xargs clang-format-18 --dry-run -Werror
