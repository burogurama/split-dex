name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, types & tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # setup-uv has no major-version tags (v10) since v8: pin a full version.
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Check formatting
        run: uv run ruff format --check
      - name: Lint
        run: uv run ruff check
      - name: Type-check
        run: uv run mypy
      - name: Test
        run: uv run pytest
